<!doctype html>
<!-- Molde da capa do Facebook (1640 x 624). Gerado por ferramentas/marca.ps1
     O conteúdo fica na faixa central de ~1100 px, que é o que aparece no celular. -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Poppins:ital,wght@1,800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1640px;height:624px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 70% 120% at 50% 40%,#0f4a72 0%,#0B3C5D 45%,#072a42 100%)}
.ondas{position:absolute;left:0;right:0;bottom:14px;width:100%;height:170px}
.faixa{position:absolute;left:0;right:0;bottom:0;height:14px;background:#F5A532}
.conteudo{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);display:flex;align-items:center;gap:56px}
.logo{width:280px;height:280px;flex:none;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
.texto{border-left:3px solid #F5A532;padding-left:48px}
h1{margin:0;font:italic 800 90px/1 'Poppins',sans-serif;letter-spacing:.02em;color:#F5A532;white-space:nowrap}
h1 b{color:#fff}
.lema{margin:18px 0 0;font:600 21px 'Outfit',sans-serif;letter-spacing:.36em;text-transform:uppercase;color:#fff}
.onde{margin:10px 0 0;font:400 24px 'Outfit',sans-serif;color:rgba(255,255,255,.78)}
.onde span{color:#F5A532}
</style>
<body>
<svg class="ondas" viewBox="0 0 1640 170" preserveAspectRatio="none" fill="none" stroke-linecap="round">
  <path d="M-20 70 q102.5 -40 205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0" stroke="#19B5D6" stroke-width="5" opacity=".22"/>
  <path d="M-120 125 q102.5 -36 205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0 t205 0" stroke="#19B5D6" stroke-width="5" opacity=".12"/>
</svg>
<div class="conteudo">
  <img class="logo" src="../marca/logo-emblema.png" alt="">
  <div class="texto">
    <h1><b>O</b> PISCINEIRO</h1>
    <p class="lema">Garantindo o seu lazer</p>
    <p class="onde">Limpeza de piscinas em <span>Barra Velha, SC</span></p>
  </div>
</div>
<div class="faixa"></div>
